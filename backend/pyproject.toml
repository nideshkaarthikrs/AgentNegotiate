[project]
name = "agent-negotiate"
version = "0.1.0"
description = "Two-agent B2B procurement negotiation system using LangGraph, Groq, and Razorpay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "razorpay>=1.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "groq>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
